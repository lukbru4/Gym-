<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Tracker</title>
  <meta name="description" content="Trainings, Fortschritt und Körpergewicht tracken">
  <meta name="theme-color" content="#1f6fd1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1><a href="#/">🏋️ Gym Tracker</a></h1>
    <button class="link" id="logout" hidden>Abmelden</button>
  </header>
  <main id="view" class="container"><p class="muted center">Lädt …</p></main>
  <nav id="nav" class="bottom-nav" hidden>
    <a href="#/"><span aria-hidden="true">🏠</span>Start</a>
    <a href="#/workouts"><span aria-hidden="true">🏋️</span>Workouts</a>
    <a href="#/verlauf"><span aria-hidden="true">📋</span>Verlauf</a>
    <a href="#/fortschritt"><span aria-hidden="true">📈</span>Fortschritt</a>
    <a href="#/koerper"><span aria-hidden="true">🧍</span>Körper</a>
  </nav>
  <div id="rest-timer" class="rest-timer" role="timer" aria-live="off" hidden>
    <div class="rest-bar"><span></span></div>
    <div class="rest-controls">
      <button class="btn small-btn" data-rest="minus" aria-label="15 Sekunden weniger">−15</button>
      <div class="rest-center"><span class="small muted">Pause</span><strong class="rest-time">0:00</strong></div>
      <button class="btn small-btn" data-rest="plus" aria-label="15 Sekunden mehr">+15</button>
      <button class="btn small-btn primary" data-rest="skip">Weiter</button>
    </div>
  </div>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Level Up</title>
  <meta name="description" content="Trainings, Fortschritt und Körpergewicht tracken">
  <meta name="theme-color" content="#1f6fd1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Level Up">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script>
    // Design vor dem ersten Zeichnen setzen (gleiche Regel wie js/theme.js)
    try {
      document.documentElement.dataset.scheme = localStorage.getItem('gym-tracker-scheme') || 'energie';
      var m = localStorage.getItem('gym-tracker-theme') || 'time', h = new Date().getHours();
      if (m === 'time') document.documentElement.dataset.theme = h >= 18 || h < 6 ? 'dark' : 'light';
      else if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m;
    } catch (e) {
      document.documentElement.dataset.scheme = 'energie';
      var hh = new Date().getHours();
      document.documentElement.dataset.theme = hh >= 18 || hh < 6 ? 'dark' : 'light';
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="app-title"><a href="#/">🏋️ Level Up</a></h1>
    <a class="hud-player" id="hud-player" href="#/profil" aria-label="Profil" hidden>
      <span class="avatar-sm" id="hud-avatar">L</span>
      <span class="hud-level"><strong id="hud-level">Lv.1</strong><span class="xp-bar"><span id="hud-xp"></span></span></span>
    </a>
    <a class="hud-stat" id="hud-streak" href="#/" title="Serie: Wochen in Folge mit Training" hidden>
      <svg class="flame" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1 C13 6 18 8 20 13 C23 20 18 27 12 27 C6 27 1 22 3 15 C4 11 7 9 7 5 C9 7 10 9 10 12 C12 10 13 6 12 1 Z"/></svg>
      <strong>0</strong>
    </a>
    <a class="hud-stat" id="hud-credits" href="#/aufgaben" title="Credits" hidden>
      <svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6.5l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#fff" opacity="0.9"/></svg>
      <strong>0</strong>
    </a>
    <button class="menu-btn" id="menu-btn" aria-label="Menü" aria-expanded="false" aria-controls="menu" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="menu" id="menu" hidden>
      <a href="#/konto">Konto & Einstellungen</a>
      <a href="#/backup">Backup</a>
      <button id="menu-signout" hidden>Abmelden</button>
    </div>
  </header>
  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>Neue Version verfügbar <small class="update-version"></small></span>
    <button class="btn small-btn primary">Aktualisieren</button>
  </div>
  <nav id="subnav" class="subnav" aria-label="Ränge" hidden>
    <a href="#/raenge">Rang</a>
    <a href="#/koerper">Körpergraph</a>
    <a href="#/rekorde">Rekorde</a>
    <a href="#/fortschritt">Analyse</a>
  </nav>
  <main id="view" class="container"><p class="muted center">Lädt …</p></main>
  <nav id="nav" class="bottom-nav" hidden>
    <a href="#/workouts" data-section="workouts"><span aria-hidden="true">🏋️</span>Workout</a>
    <a href="#/" data-section="home"><span aria-hidden="true">🏠</span>Home</a>
    <a href="#/raenge" data-section="raenge"><span aria-hidden="true">🏅</span>Ränge</a>
    <a href="#/freunde" data-section="freunde"><span aria-hidden="true">👥</span>Freunde</a>
    <a href="#/profil" data-section="profil"><span aria-hidden="true">👤</span>Profil</a>
  </nav>
  <div id="rest-timer" class="rest-timer" role="timer" aria-live="off" hidden>
    <div class="rest-bar"><span></span></div>
    <div class="rest-controls">
      <button class="btn small-btn" data-rest="minus" aria-label="15 Sekunden weniger">−15</button>
      <div class="rest-center"><span class="small muted">Pause</span><strong class="rest-time">0:00</strong></div>
      <button class="btn small-btn" data-rest="plus" aria-label="15 Sekunden mehr">+15</button>
      <button class="btn small-btn primary" data-rest="skip">Weiter</button>
    </div>
  </div>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>

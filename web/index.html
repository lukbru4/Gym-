<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Level Up</title>
  <meta name="description" content="Trainings, Fortschritt und Körpergewicht tracken">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Level Up">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script>
    // Design vor dem ersten Zeichnen setzen (gleiche Regeln wie src/lib/theme.ts)
    try {
      var r = document.documentElement;
      var sc = localStorage.getItem('gym-tracker-scheme') || 'standard';
      var cs = sc.indexOf('custom:') === 0 ? JSON.parse(localStorage.getItem('gym-tracker-custom-scheme') || 'null') : null;
      r.dataset.scheme = cs && cs.id === sc.slice(7) ? 'custom' : sc;
      var m = localStorage.getItem('gym-tracker-theme') || 'dark', h = new Date().getHours();
      var hrs = JSON.parse(localStorage.getItem('gym-tracker-dark-hours') || 'null') || { from: 18, until: 6 };
      var night = hrs.from > hrs.until ? h >= hrs.from || h < hrs.until : h >= hrs.from && h < hrs.until;
      if (m === 'time') r.dataset.theme = night ? 'dark' : 'light';
      else if (m === 'light' || m === 'dark') r.dataset.theme = m;
      var dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (r.dataset.scheme === 'custom') {
        var vars = dark ? cs.dark : cs.light;
        for (var k in vars) r.style.setProperty(k, vars[k]);
        r.style.setProperty('--neon', cs.neon);
        r.style.setProperty('color-scheme', dark ? 'dark' : 'light');
      }
      var a = JSON.parse(localStorage.getItem('gym-tracker-accent') || 'null');
      if (a && a.light) {
        r.style.setProperty('--accent', dark ? a.dark : a.light);
        r.style.setProperty('--accent-text', dark ? a.darkText : a.lightText);
      }
    } catch (e) {
      document.documentElement.dataset.scheme = 'standard';
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

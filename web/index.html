<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Level Up</title>
  <meta name="description" content="Trainings, Fortschritt und Körpergewicht tracken">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Level Up">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script>
    // Design vor dem ersten Zeichnen setzen (gleiche Regel wie src/lib/theme.ts)
    try {
      document.documentElement.dataset.scheme = localStorage.getItem('gym-tracker-scheme') || 'energie';
      var m = localStorage.getItem('gym-tracker-theme') || 'time', h = new Date().getHours();
      if (m === 'time') document.documentElement.dataset.theme = h >= 18 || h < 6 ? 'dark' : 'light';
      else if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m;
    } catch (e) {
      document.documentElement.dataset.scheme = 'energie';
      var hh = new Date().getHours();
      document.documentElement.dataset.theme = hh >= 18 || hh < 6 ? 'dark' : 'light';
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

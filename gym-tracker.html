  --text-secondary: #52514e;
  --accent: #1f6fd1;
  --accent-text: #ffffff;
  --danger: #c93a39;
  --grid: #e8e7e2;
  --invalid: #fbe9e9;
  --series-1: #2a78d6;

}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
}
h1, h2, h3 { line-height: 1.2; }
h2 { font-size: 1.3rem; margin: 24px 0 12px; }
h3 { font-size: 1.05rem; margin: 0 0 8px; }
a { color: var(--accent); }
code { font-size: 0.9em; }

.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 1.1rem; margin: 0; }
.topbar h1 a { color: var(--text); text-decoration: none; }

.container { max-width: 720px; margin: 0 auto; padding: 16px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card.auth { max-width: 420px; margin: 32px auto; }
.notes { white-space: pre-wrap; }

.muted { color: var(--text-secondary); }
.small { font-size: 0.85rem; }
.center { text-align: center; }
.notice { background: var(--bg); border-radius: 10px; padding: 10px 12px; }

label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 12px; }
input, select, textarea {
  display: block; width: 100%;
  margin-top: 6px;
  font: inherit; font-weight: 400;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  min-height: 48px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
input.invalid { background: var(--invalid); border-color: var(--danger); }
textarea { resize: vertical; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 0 18px;
  font: inherit; font-weight: 600;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  text-decoration: none;
  cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.block { display: flex; width: 100%; }
.btn.big { min-height: 56px; font-size: 1.1rem; }
.btn:disabled { opacity: 0.6; cursor: wait; }
.small-btn { min-height: 40px; margin-top: 10px; }
.link { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 8px 0; }
.icon-btn {
  width: 40px; height: 40px;
  border: 0; border-radius: 10px;
  background: transparent; color: var(--text-secondary);
  font-size: 1.1rem; cursor: pointer;
}
.icon-btn:hover { background: var(--bg); }

.row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.grow { flex: 1 1 140px; }

.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
@media (min-width: 600px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; display: flex; flex-direction: column; gap: 2px;
}
.tile-value { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile-label { font-size: 0.85rem; color: var(--text-secondary); }

.chart { position: relative; height: 220px; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { margin-bottom: 8px; }
.list a, .list-row {
  display: flex; flex-direction: column; gap: 2px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 16px; color: var(--text); text-decoration: none;
}
.list-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.list-row span { flex: 1; }

.block-head { display: flex; align-items: center; justify-content: space-between; }
.block-head h3 { margin: 0; }
.set-no { color: var(--text-secondary); text-align: center; font-weight: 600; }
.inline-form { display: grid; grid-template-columns: 1fr; gap: 8px; }
.inline-form input, .inline-form select { margin: 0; }

.table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.table th, .table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
.scroll-x { overflow-x: auto; }
.table-toggle { margin-top: 12px; }
.table-toggle summary { cursor: pointer; color: var(--accent); padding: 6px 0; }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--border);
}
.bottom-nav[hidden] { display: none; }
.bottom-nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 0.72rem; color: var(--text-secondary); text-decoration: none;
}
.bottom-nav a span { font-size: 1.3rem; }
.bottom-nav a.active { color: var(--accent); font-weight: 700; }

.toast {
  position: fixed; left: 16px; right: 16px; z-index: 20;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  max-width: 560px; margin: 0 auto;
  background: var(--danger); color: #fff;
  padding: 12px 16px; border-radius: 12px;
}

/* Editor: Satz-Tabelle */
.editor-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.editor-head #elapsed { font-variant-numeric: tabular-nums; }
.rest-select { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 8px 0 0; }
.rest-select select { width: auto; min-height: 36px; padding: 4px 8px; margin: 0; }
.set-table { margin-top: 8px; }
.set-row {
  display: grid; gap: 8px; align-items: center;
  grid-template-columns: 40px 1fr 1fr 40px;
  padding: 4px; border-radius: 10px;
}
.set-table.live .set-row { grid-template-columns: 36px minmax(0, 1.1fr) 1fr 1fr 44px; }
.set-row.head { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
.set-row.head span { text-align: center; }
.set-row input { margin: 0; text-align: center; font-variant-numeric: tabular-nums; min-width: 0; padding: 10px 4px; }
.set-row.done { background: var(--done); }
.set-type { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; height: 40px; font: inherit; font-weight: 700; color: var(--text); cursor: pointer; }
.set-type.warmup, .warmup-label { color: var(--warmup); font-weight: 700; }
.prev { text-align: center; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check {
  width: 44px; height: 44px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary);
  font-size: 1.2rem; font-weight: 700;
}
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.card.highlight { border-color: var(--accent); }

/* Muskel-Auswahl */
.chips { border: 0; padding: 0; margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips legend { margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; font-size: 0.85rem;
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); cursor: pointer; }
.chip input { width: auto; min-height: 0; margin: 0; }
.chip:has(input:checked) { border-color: var(--accent); color: var(--accent); }
form.assign { padding: 10px 0; border-top: 1px solid var(--border); }

/* Körpergraph */
.bodygraph { display: block; width: 100%; max-width: 420px; margin: 0 auto; }
.bodygraph .body-base { fill: var(--body-base); }
.bodygraph .muscle { stroke: var(--surface); stroke-width: 2; stroke-linejoin: round; cursor: pointer; outline: none; }
.bodygraph .muscle:hover, .bodygraph .muscle:focus-visible { stroke: var(--text); }
.bodygraph .body-detail { fill: none; stroke: var(--surface); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.bodygraph .body-label { fill: var(--text-secondary); font-size: 16px; }
.legend { list-style: none; padding: 0; margin: 12px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--text-secondary); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Pause-Timer */
.rest-timer {
  position: fixed; left: 0; right: 0; z-index: 15;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 8px 16px 10px;
}
.rest-bar { height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
.rest-bar span { display: block; height: 100%; background: var(--accent); transition: width 0.25s linear; }
.rest-controls { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; max-width: 560px; margin: 0 auto; }
.rest-controls .btn { margin: 0; }
.rest-center { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.rest-time { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
body.has-timer { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px); }
body.has-timer .toast { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px); }

[hidden] { display: none !important; }

function parseRowLoose(row, cardio) {
  const num = (v) => {
    const n = parseNum(v);
    if (Number.isNaN(n)) throw new Error("Bitte nur Zahlen eingeben.");
    return n;
  };
  if (cardio) return { duration_min: num(row.duration_min), distance_km: num(row.distance_km) };
  const reps = num(row.reps);
  if (reps != null && !Number.isInteger(reps)) throw new Error("Wiederholungen müssen ganze Zahlen sein.");
  return { reps, weight_kg: num(row.weight_kg) };
}
function parseRowSafe(row, block) {
  try {

  } catch {
    return null;
  }
}

    return {

      sets: b.sets.map((row) => {

        if (cardio) return v || { duration_min: row.target?.duration_min ?? null, distance_km: row.target?.distance_km ?? null };
        return {
          warmup: Boolean(row.warmup),
          reps: v ? v.reps : row.target?.reps ?? null,
          weight_kg: v ? v.weight_kg : row.target?.weight_kg ?? null

      <ul class="legend" aria-label="Legende">
        <li><span class="swatch" style="background:var(--level-0)"></span>nicht trainiert</li>
        ${LEVELS.map((l) => `<li><span class="swatch" style="background:var(--level-${l.level})"></span>Stufe ${l.level}: ${l.label}</li>`).join("")}
      </ul>
      <p class="muted small">Kraft-Stufe = wie stark dein geschätztes 1RM (Epley) seit deinem ersten Training
      gestiegen ist: bester Wert der letzten 30 Tage gegenüber dem ersten Training, gemittelt über alle Übungen
      des Muskels. Aufwärmsätze zählen nicht. Tippe auf einen Muskel für Details.</p>
      ${trained.length ? `<details class="table-toggle"><summary>Als Tabelle anzeigen</summary>
          <table class="table"><thead><tr><th>Muskel</th><th>Stufe</th><th>Steigerung</th><th>Übungen</th></tr></thead>
          <tbody>${trained.map(([m, r]) => `<tr><td>${esc(MUSCLE_NAMES.get(m))}</td><td>${r.level}</td><td>${pct(r.gain)}</td>
              <td class="small">${r.exercises.map((x) => `${esc(x.name)}: ${fmt(x.first)} → ${fmt(x.current)} kg`).join("<br>")}</td></tr>`).join("")}</tbody></table></details>` : '<p class="muted">Sobald du Krafttrainings gespeichert hast, färbt sich der Körper ein.</p>'}
      <p id="muscle-detail" class="notice small" hidden></p>
    </div>
    ${unassigned.length ? `<div class="card"><h3>Übungen ohne Muskelzuordnung</h3>
          <p class="muted small">Diese eigenen Übungen erscheinen erst im Körpergraphen, wenn du ihnen Muskeln zuordnest.</p>
          ${unassigned.map((e) => `<form class="assign" data-ex="${e.id}"><strong>${esc(e.name)}</strong>${usedIds.has(e.id) ? "" : ' <span class="muted small">(noch nicht trainiert)</span>'}
              ${muscleChips("muscle")}<button class="btn small-btn" type="submit">Speichern</button></form>`).join("")}</div>` : ""}
    <h2>Körpergewicht</h2>
    <form class="card" id="bw-form">
      <div class="row">
        <label class="grow">Datum<input type="date" name="date" value="${todayISO()}" required></label>
        <label class="grow">Gewicht (kg)<input name="weight" inputmode="decimal" placeholder="z. B. 80,5" required></label>
      </div>
      <button class="btn primary block" type="submit">Speichern</button>
      <p class="muted small">Pro Tag gibt es einen Eintrag – ein neuer Wert für denselben Tag ersetzt den alten.</p>
    </form>
    ${weights.length ? `<div class="card"><h3>Verlauf</h3><div class="chart"><canvas id="bw-chart"></canvas></div></div>
         <ul class="list">${[...weights].reverse().map(
    (w) => `<li class="list-row"><span>${fmtDate(w.date)}</span><strong>${fmt(w.weight_kg)} kg</strong>
               <button class="icon-btn" data-id="${w.id}" aria-label="Eintrag löschen">✕</button></li>`
  ).join("")}</ul>` : '<p class="muted">Noch keine Einträge.</p>'}`;
  if (weights.length) {
    makeChart(view.querySelector("#bw-chart"), "line", weights.map((w) => fmtShortDate(w.date)), [
      { label: "Körpergewicht", data: weights.map((w) => Number(w.weight_kg)), color: cssVar("--series-1") }
    ], "kg");
  }
  const detail = view.querySelector("#muscle-detail");
  const showMuscle = (g) => {
    const r = levels.get(g.dataset.muscle);
    detail.hidden = false;
    detail.innerHTML = `<strong>${esc(MUSCLE_NAMES.get(g.dataset.muscle))}</strong>: ${r.level ? `Stufe ${r.level} (${pct(r.gain)})<br>${r.exercises.map((x) => `${esc(x.name)}: ${fmt(x.first)} → ${fmt(x.current)} kg (${pct(x.gain)})`).join("<br>")}` : "noch nicht trainiert"}`;
  };
  view.querySelectorAll(".muscle").forEach((g) => {
    g.onclick = () => showMuscle(g);
    g.onkeydown = (e) => (e.key === "Enter" || e.key === " ") && showMuscle(g);
  });
  view.querySelectorAll("form.assign").forEach((form) => {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const muscles = new FormData(form).getAll("muscle");
      if (!muscles.length) return showError(new Error("Bitte mindestens einen Muskel auswählen."));
      try {
        const updated = await api.updateExercise(Number(form.dataset.ex), { muscles });
        exercises = exercises.map((x) => x.id === updated.id ? updated : x);
        renderBody().catch(showError);
      } catch (err) {
        showError(err);
      }
    };
  });
  view.querySelector("#bw-form").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const weight = parseNum(f.get("weight"));
    if (!weight || Number.isNaN(weight)) return showError(new Error("Bitte ein gültiges Gewicht eingeben."));
    try {
      await api.saveBodyWeight(f.get("date"), weight);
      renderBody().catch(showError);
    } catch (err) {
      showError(err);
    }
  };
  view.querySelectorAll("[data-id]").forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm("Eintrag löschen?")) return;
      try {
        await api.deleteBodyWeight(Number(btn.dataset.id));
        renderBody().catch(showError);
      } catch (err) {
        showError(err);
      }
    };
  });
}
async function renderBackup() {
  if (api.mode !== "local") {
    view.innerHTML = '<h2>Backup</h2><p class="muted">Deine Daten liegen in der Cloud (Supabase) und brauchen kein manuelles Backup.</p>';
    return;
  }
  const data = api.exportData();
  view.innerHTML = `
    <h2>Backup</h2>
    <div class="card">
      <p>Im lokalen Modus liegen deine Daten nur in diesem Browser. Löschst du die Browserdaten,
      sind sie weg. Exportiere deshalb regelmäßig eine Sicherung.</p>
      <p class="muted small">Gespeichert: ${plural(data.workouts.length, "Training", "Trainings")},
      ${plural(data.sets.length, "Satz", "Sätze")}, ${plural(data.body_weights.length, "Gewichtseintrag", "Gewichtseinträge")}.</p>
      <button class="btn primary block" id="export">Backup herunterladen</button>
    </div>
    <div class="card">
      <h3>Backup einspielen</h3>
      <p class="muted small">Ersetzt alle Daten in diesem Browser durch die Daten aus der Datei.
      So kannst du deine Daten auch auf ein anderes Gerät übertragen.</p>
      <label>Backup-Datei (.json)<input type="file" id="import" accept="application/json,.json"></label>
    </div>`;
  view.querySelector("#export").onclick = () => {
    const blob = new Blob([JSON.stringify(api.exportData(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `gym-tracker-backup-${todayISO()}.json`;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1e3);
  };
  view.querySelector("#import").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const obj = api.validateBackup(JSON.parse(await file.text()));
      if (!confirm("Alle aktuellen Daten in diesem Browser werden ersetzt. Fortfahren?")) return;
      api.importData(obj);
      exercises = await api.listExercises();
      clearDraft();
      location.hash = "#/";
    } catch (err) {
      showError(err instanceof SyntaxError ? new Error("Die Datei ist kein gültiges JSON.") : err);
    } finally {
      e.target.value = "";
    }
  };
}
async function init() {
  initTimer(document.getElementById("rest-timer"));
  try {
    api = await createBackend();
  } catch (err) {
    console.error(err);
    return renderStartError(err);
  }
  const headerBtn = document.getElementById("logout");
  if (api.mode === "local") {
    user = await api.getUser();
    exercises = await api.listExercises();
    headerBtn.textContent = "Backup";
    headerBtn.onclick = () => location.hash = "#/backup";
  } else {
    user = await api.getUser();
    if (user) exercises = await api.listExercises();
    api.onAuthChange((u) => {
      const changed = u?.id !== user?.id;
      user = u;
      if (!changed) return;
      setTimeout(async () => {
        exercises = u ? await api.listExercises().catch((err) => (showError(err), [])) : [];
        if (!u) clearDraft();
        route();
      }, 0);
    });
    headerBtn.onclick = () => api.signOut();
  }
  window.addEventListener("hashchange", route);
  route();
}
init().catch(showError);
if ("serviceWorker" in navigator && !window.GYM_STANDALONE) {
  navigator.serviceWorker.register("./sw.js").catch(() => {
  });
}
</script>
</head>
<body>
  <header class="topbar">
    <h1><a href="#/">🏋️ Gym Tracker</a></h1>
    <button class="link" id="logout" hidden>Abmelden</button>
  </header>
  <main id="view" class="container"><p class="muted center">Lädt …</p></main>
  <nav id="nav" class="bottom-nav" hidden>
    <a href="#/"><span aria-hidden="true">🏠</span>Start</a>
    <a href="#/workouts"><span aria-hidden="true">🏋️</span>Workouts</a>
    <a href="#/verlauf"><span aria-hidden="true">📋</span>Verlauf</a>
    <a href="#/fortschritt"><span aria-hidden="true">📈</span>Fortschritt</a>
    <a href="#/koerper"><span aria-hidden="true">🧍</span>Körper</a>
  </nav>
  <div id="rest-timer" class="rest-timer" role="timer" aria-live="off" hidden>
    <div class="rest-bar"><span></span></div>
    <div class="rest-controls">
      <button class="btn small-btn" data-rest="minus" aria-label="15 Sekunden weniger">−15</button>
      <div class="rest-center"><span class="small muted">Pause</span><strong class="rest-time">0:00</strong></div>
      <button class="btn small-btn" data-rest="plus" aria-label="15 Sekunden mehr">+15</button>
      <button class="btn small-btn primary" data-rest="skip">Weiter</button>
    </div>
  </div>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>

# Baut die nativen Apps (Capacitor) in der Cloud – ohne eigenen Mac oder Android Studio.
# Android: Test-APK als Download (Actions → Lauf → Artifacts).
# iOS: Build für den Simulator, prüft dass das Xcode-Projekt kompiliert. Für ein echtes iPhone
# (TestFlight) braucht es später ein Apple-Developer-Konto und Signier-Zertifikate (Phase 6).
name: Native Apps

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: web/android
      - uses: actions/upload-artifact@v4
        with:
          name: level-up-android-test-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync ios
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Build (Simulator, ohne Signatur)
        working-directory: web/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
